name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release
      
      - name: Build
        shell: bash
        run: |
          [ ! -f _quarto.yml ] && echo -e "project:\n  output-dir: _site" > _quarto.yml
          if grep -q "output-dir: _site" _quarto.yml; then
            quarto render
          else
            quarto render --output-dir _site
          fi
      
      - name: Deploy to gh-pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create temp directory and move build output
          mkdir -p /tmp/_site
          cp -r _site/* /tmp/_site/
          
          # Check if gh-pages branch exists
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi
          
          # Clear current content and add new build
          git rm -rf . || true
          cp -r /tmp/_site/* .
          touch .nojekyll
          
          # Commit and push
          git add .
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push origin gh-pages --force
